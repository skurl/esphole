<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>esphole setup</title><style>
:root{--bg:#0f1216;--card:#171c22;--line:#242c35;--fg:#e6edf3;--dim:#8b98a5;--blue:#4c9aff;--red:#ff6b6b;--grn:#4ade80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;width:100%;max-width:380px}
h1{font-size:19px;margin:0 0 6px}
p.sub{color:var(--dim);font-size:13px;margin:0 0 20px}
label{display:block;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 5px}
input{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--line);border-radius:7px;color:var(--fg);font-size:15px}
input:focus{outline:none;border-color:var(--blue)}
button{width:100%;margin-top:20px;padding:11px;background:var(--blue);color:#06121f;border:0;border-radius:7px;font-size:15px;font-weight:600;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
#msg{margin-top:14px;font-size:13px;min-height:19px}
.ok{color:var(--grn)}.err{color:var(--red)}
.note{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);color:var(--dim);font-size:12px}
</style></head><body>
<form class="card" id="f">
  <h1>esphole setup</h1>
  <p class="sub">Enter the network this device should join.</p>
  <label for="s">Network name</label>
  <input id="s" name="ssid" autocapitalize="none" autocorrect="off" required>
  <label for="p">Password</label>
  <input id="p" name="pass" type="password" autocomplete="off">
  <button id="b">Save and restart</button>
  <div id="msg"></div>
  <div class="note">2.4GHz only — this hardware has no 5GHz radio. Leave the
  password blank for an open network.</div>
</form>
<script>
const f=document.getElementById('f'),m=document.getElementById('msg'),b=document.getElementById('b');
f.addEventListener('submit',async e=>{
  e.preventDefault();
  b.disabled=true; m.className=''; m.textContent='Saving…';
  const body=new URLSearchParams({ssid:f.ssid.value,pass:f.pass.value}).toString();
  try{
    const r=await fetch('/api/wifi',{method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},body});
    const j=await r.json();
    if(!j.ok)throw new Error(j.error||'failed');
    m.className='ok';
    m.textContent='Saved. Restarting — reconnect to your normal network.';
  }catch(err){
    m.className='err'; m.textContent=err.message||'Could not save'; b.disabled=false;
  }
});
</script></body></html>
