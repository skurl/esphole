<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>esphole</title><style>
:root{--bg:#0f1216;--card:#171c22;--line:#242c35;--fg:#e6edf3;--dim:#8b98a5;
--blue:#4c9aff;--red:#ff6b6b;--grn:#4ade80;--amb:#fbbf24}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:20px}
.wrap{max-width:940px;margin:0 auto}
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:20px;margin:0;letter-spacing:-.01em}
h1 span{color:var(--dim);font-weight:400}
#dot{width:8px;height:8px;border-radius:50%;background:var(--grn);display:inline-block}
#dot.off{background:var(--red)}
.meta{color:var(--dim);font-size:13px;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.card .k{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.card .v{font-size:26px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.panel h2{font-size:13px;margin:0 0 14px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
#chart{display:flex;align-items:flex-end;gap:3px;height:140px}
#chart div{flex:1;position:relative;background:var(--blue);border-radius:2px 2px 0 0;min-height:2px;opacity:.5}
#chart div i{position:absolute;left:0;right:0;bottom:0;background:var(--red);border-radius:2px 2px 0 0;display:block}
.axis{display:flex;justify-content:space-between;color:var(--dim);font-size:11px;margin-top:6px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:640px){.cols{grid-template-columns:1fr}.meta{margin-left:0;width:100%}}
table{width:100%;border-collapse:collapse;table-layout:fixed}
td{padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
td:last-child{text-align:right;color:var(--dim);font-variant-numeric:tabular-nums;width:72px}
tr:last-child td{border-bottom:0}
.dom{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--dim);font-size:13px;padding:8px 0}
.legend{color:var(--dim);font-size:11px;margin-left:8px;font-weight:400}
.legend b{color:var(--blue);font-weight:600}.legend i{color:var(--red);font-style:normal;font-weight:600}
footer{color:var(--dim);font-size:12px;display:flex;gap:18px;flex-wrap:wrap}
</style></head><body><div class="wrap">
<header>
  <h1><span id="dot"></span> esphole <span id="ver"></span></h1>
  <div class="meta" id="meta">connecting…</div>
</header>

<div class="grid">
  <div class="card"><div class="k">Queries</div><div class="v" id="q">–</div></div>
  <div class="card"><div class="k">Blocked</div><div class="v" id="b" style="color:var(--red)">–</div></div>
  <div class="card"><div class="k">Block rate</div><div class="v" id="pct">–</div></div>
  <div class="card"><div class="k">Free heap</div><div class="v" id="heap">–</div></div>
</div>

<div class="panel">
  <h2>Last 24 hours <span class="legend"><b>■</b> queries &nbsp;<i>■</i> blocked</span></h2>
  <div id="chart"></div>
  <div class="axis"><span>24h ago</span><span>now</span></div>
</div>

<div class="cols">
  <div class="panel"><h2>Top blocked</h2><div id="tb"></div></div>
  <div class="panel"><h2>Top queried</h2><div id="tq"></div></div>
</div>

<footer>
  <span id="list">–</span><span id="fwd">–</span><span id="fail">–</span><span id="drop">–</span>
</footer>
</div><script>
const $=i=>document.getElementById(i);
const n=v=>v.toLocaleString();

function dur(s){
  const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);
  return d?`${d}d ${h}h`:h?`${h}h ${m}m`:`${m}m ${s%60}s`;
}
function table(el,rows){
  if(!rows.length){el.innerHTML='<div class="empty">Nothing yet</div>';return}
  el.innerHTML='<table>'+rows.map(r=>
    `<tr><td class="dom" title="${r.n}">${r.n}</td><td>${n(r.c)}</td></tr>`).join('')+'</table>';
}
function chart(s){
  // hour_index is the newest bucket; walk forward from it to get oldest-first.
  const q=[],b=[];
  for(let i=1;i<=24;i++){const k=(s.hour_index+i)%24;q.push(s.hourly_q[k]);b.push(s.hourly_b[k])}
  const max=Math.max(1,...q);
  $('chart').innerHTML=q.map((v,i)=>{
    const h=Math.round(v/max*100), bh=v?Math.round(b[i]/v*100):0;
    return `<div style="height:${Math.max(h,1)}%" title="${n(v)} queries, ${n(b[i])} blocked">`+
           `<i style="height:${bh}%"></i></div>`;
  }).join('');
}

async function tick(){
  try{
    const r=await fetch('/api/stats',{cache:'no-store'});
    if(!r.ok)throw 0;
    const s=await r.json();
    $('dot').className='';
    $('q').textContent=n(s.queries);
    $('b').textContent=n(s.blocked);
    $('pct').textContent=s.queries?(100*s.blocked/s.queries).toFixed(1)+'%':'0%';
    $('heap').textContent=Math.round(s.free_heap/1024)+'K';
    $('meta').textContent=`up ${dur(s.uptime_s)} · min heap ${Math.round(s.min_free_heap/1024)}K`;
    $('list').textContent=s.list_ready?`${n(s.list_count)} domains blocked`:'no blocklist (forwarding all)';
    $('fwd').textContent=`${n(s.forwarded)} forwarded`;
    $('fail').textContent=`${n(s.upstream_fail)} upstream failures`;
    $('drop').textContent=`${n(s.dropped)} dropped`;
    chart(s); table($('tb'),s.top_blocked); table($('tq'),s.top_queried);
  }catch(e){
    $('dot').className='off';
    $('meta').textContent='not responding';
  }
}
tick(); setInterval(tick,5000);
</script></body></html>
