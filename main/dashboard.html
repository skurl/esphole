<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>esphole</title><style>
:root{--bg:#0f1216;--card:#171c22;--line:#242c35;--fg:#e6edf3;--dim:#8b98a5;
--blue:#4c9aff;--red:#ff6b6b;--grn:#4ade80;--amb:#fbbf24}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:20px}
.wrap{max-width:940px;margin:0 auto}
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:20px;margin:0;letter-spacing:-.01em}
#dot{width:8px;height:8px;border-radius:50%;background:var(--grn);display:inline-block}
#dot.off{background:var(--red)}
.meta{color:var(--dim);font-size:13px;margin-left:auto;text-align:right}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.card .k{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.card .v{font-size:26px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.panel h2{font-size:13px;margin:0 0 14px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
#chart{display:flex;align-items:flex-end;gap:3px;height:140px}
#chart div{flex:1;position:relative;background:var(--blue);border-radius:2px 2px 0 0;min-height:2px;opacity:.5}
#chart div i{position:absolute;left:0;right:0;bottom:0;background:var(--red);border-radius:2px 2px 0 0;display:block}
.axis{display:flex;justify-content:space-between;color:var(--dim);font-size:11px;margin-top:6px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:640px){.cols{grid-template-columns:1fr}.meta{margin-left:0;text-align:left;width:100%}}
table{width:100%;border-collapse:collapse;table-layout:fixed}
td{padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
td:last-child{text-align:right;color:var(--dim);font-variant-numeric:tabular-nums;width:72px}
tr:last-child td{border-bottom:0}
.dom{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--dim);font-size:13px;padding:8px 0}
.legend{color:var(--dim);font-size:11px;margin-left:8px;font-weight:400}
.legend b{color:var(--blue);font-weight:600}.legend i{color:var(--red);font-style:normal;font-weight:600}
footer{color:var(--dim);font-size:12px;display:flex;gap:18px;flex-wrap:wrap;margin-top:4px}
#recent{max-height:280px;overflow-y:auto}
#recent td:first-child{width:78px}
#recent td:last-child{width:52px}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em}
.v0{background:#1d2b3a;color:var(--blue)}
.v1{background:#3a1d20;color:var(--red)}
.v2{background:#173026;color:var(--grn)}
.v3{background:#33290f;color:var(--amb)}
form.add{display:flex;gap:8px;margin-bottom:12px}
form.add input{flex:1;min-width:0;padding:7px 10px;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--fg);font-size:13px}
form.add input.ip{flex:0 0 118px}
form.add input:focus{outline:none;border-color:var(--blue)}
form.add button{padding:7px 14px;background:var(--blue);color:#06121f;border:0;border-radius:6px;font-weight:600;font-size:13px;cursor:pointer}
.del{background:none;border:0;color:var(--dim);cursor:pointer;font-size:15px;padding:0 2px;line-height:1}
.del:hover{color:var(--red)}
.err{color:var(--red);font-size:12px;min-height:16px;margin-bottom:8px}
</style></head><body><div class="wrap">
<header>
  <h1><span id="dot"></span> esphole</h1>
  <div class="meta" id="meta">connecting…</div>
</header>

<div class="grid">
  <div class="card"><div class="k">Queries</div><div class="v" id="q">–</div></div>
  <div class="card"><div class="k">Blocked</div><div class="v" id="b" style="color:var(--red)">–</div></div>
  <div class="card"><div class="k">Block rate</div><div class="v" id="pct">–</div></div>
  <div class="card"><div class="k">Free heap</div><div class="v" id="heap">–</div></div>
</div>

<div class="panel">
  <h2>Last 24 hours <span class="legend"><b>■</b> queries &nbsp;<i>■</i> blocked</span></h2>
  <div id="chart"></div>
  <div class="axis"><span>24h ago</span><span>now</span></div>
</div>

<div class="cols">
  <div class="panel"><h2>Top blocked</h2><div id="tb"></div></div>
  <div class="panel"><h2>Top queried</h2><div id="tq"></div></div>
</div>

<div class="panel">
  <h2>Recent queries</h2>
  <div id="recent"></div>
</div>

<div class="cols">
  <div class="panel">
    <h2>Allowlist</h2>
    <div class="err" id="ae"></div>
    <form class="add" id="af">
      <input id="ad" placeholder="example.com" autocapitalize="none" autocorrect="off" required>
      <button>Allow</button>
    </form>
    <div id="al"></div>
  </div>
  <div class="panel">
    <h2>Rewrites</h2>
    <div class="err" id="re"></div>
    <form class="add" id="rf">
      <input id="rd" placeholder="nas.home" autocapitalize="none" autocorrect="off" required>
      <input id="ri" class="ip" placeholder="192.168.0.10" required>
      <button>Add</button>
    </form>
    <div id="rl"></div>
  </div>
</div>

<footer>
  <span id="list">–</span><span id="up">–</span><span id="fwd">–</span>
  <span id="fail">–</span><span id="drop">–</span>
</footer>
</div><script>
const $=i=>document.getElementById(i);
const n=v=>v.toLocaleString();
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const VERB=['forward','block','allow','rewrite'];

function dur(s){
  const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);
  return d?`${d}d ${h}h`:h?`${h}h ${m}m`:`${m}m ${s%60}s`;
}
function ago(s){return s<60?s+'s':s<3600?Math.floor(s/60)+'m':Math.floor(s/3600)+'h'}

function table(el,rows){
  if(!rows.length){el.innerHTML='<div class="empty">Nothing yet</div>';return}
  el.innerHTML='<table>'+rows.map(r=>
    `<tr><td class="dom" title="${esc(r.n)}">${esc(r.n)}</td><td>${n(r.c)}</td></tr>`).join('')+'</table>';
}
function chart(s){
  // hour_index is the newest bucket; walk forward from it to get oldest-first.
  const q=[],b=[];
  for(let i=1;i<=24;i++){const k=(s.hour_index+i)%24;q.push(s.hourly_q[k]);b.push(s.hourly_b[k])}
  const max=Math.max(1,...q);
  $('chart').innerHTML=q.map((v,i)=>{
    const h=Math.round(v/max*100), bh=v?Math.round(b[i]/v*100):0;
    return `<div style="height:${Math.max(h,1)}%" title="${n(v)} queries, ${n(b[i])} blocked">`+
           `<i style="height:${bh}%"></i></div>`;
  }).join('');
}
function recent(rows){
  const el=$('recent');
  if(!rows.length){el.innerHTML='<div class="empty">Nothing yet</div>';return}
  el.innerHTML='<table>'+rows.map(r=>
    `<tr><td><span class="tag v${r.v}">${VERB[r.v]}</span></td>`+
    `<td class="dom" title="${esc(r.n)}">${esc(r.n)}</td><td>${ago(r.a)}</td></tr>`).join('')+'</table>';
}
function lists(s){
  $('al').innerHTML=s.allow.length
    ? '<table>'+s.allow.map(d=>`<tr><td class="dom" title="${esc(d)}">${esc(d)}</td>`+
      `<td><button class="del" data-k="allow" data-d="${esc(d)}" title="Remove">×</button></td></tr>`).join('')+'</table>'
    : '<div class="empty">Empty — blocked domains stay blocked</div>';
  $('rl').innerHTML=s.rewrite.length
    ? '<table>'+s.rewrite.map(r=>`<tr><td class="dom" title="${esc(r.n)}">${esc(r.n)} → ${esc(r.ip)}</td>`+
      `<td><button class="del" data-k="rewrite" data-d="${esc(r.n)}" title="Remove">×</button></td></tr>`).join('')+'</table>'
    : '<div class="empty">None</div>';
}

async function post(path,data,errEl){
  errEl.textContent='';
  try{
    const r=await fetch(path,{method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:new URLSearchParams(data).toString()});
    const j=await r.json();
    if(!j.ok)throw new Error(j.error||'failed');
    await tick();
    return true;
  }catch(e){ errEl.textContent=e.message||'failed'; return false }
}

$('af').addEventListener('submit',async e=>{
  e.preventDefault();
  if(await post('/api/allow',{d:$('ad').value},$('ae')))$('ad').value='';
});
$('rf').addEventListener('submit',async e=>{
  e.preventDefault();
  if(await post('/api/rewrite',{d:$('rd').value,ip:$('ri').value},$('re'))){
    $('rd').value='';$('ri').value='';
  }
});
document.addEventListener('click',e=>{
  const b=e.target.closest('.del'); if(!b)return;
  const k=b.dataset.k;
  post(`/api/${k}/del`,{d:b.dataset.d},$(k==='allow'?'ae':'re'));
});

async function tick(){
  try{
    const r=await fetch('/api/stats',{cache:'no-store'});
    if(!r.ok)throw 0;
    const s=await r.json();
    $('dot').className='';
    $('q').textContent=n(s.queries);
    $('b').textContent=n(s.blocked);
    $('pct').textContent=s.queries?(100*s.blocked/s.queries).toFixed(1)+'%':'0%';
    $('heap').textContent=Math.round(s.free_heap/1024)+'K';
    $('meta').innerHTML=`${s.ip} · up ${dur(s.uptime_s)} · min heap ${Math.round(s.min_free_heap/1024)}K`;
    $('list').textContent=s.list_ready?`${n(s.list_count)} domains blocked`:'no blocklist (forwarding all)';
    $('up').textContent=`upstream ${s.upstream}`;
    $('fwd').textContent=`${n(s.forwarded)} forwarded`;
    $('fail').textContent=`${n(s.upstream_fail)} upstream failures`;
    $('drop').textContent=`${n(s.dropped)} dropped`;
    chart(s); table($('tb'),s.top_blocked); table($('tq'),s.top_queried);
    recent(s.recent); lists(s);
  }catch(e){
    $('dot').className='off';
    $('meta').textContent='not responding';
  }
}
tick(); setInterval(tick,5000);
</script></body></html>
